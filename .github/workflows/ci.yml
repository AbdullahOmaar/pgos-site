# PGOS site CI — informational-first per the tools verdicts (3A-316).
# Real data never enters Git (.gitignore): CI builds with DEMO data only
# (data:sanitize reads no real sources), so the pipeline proves the
# build/lint gates, not the data itself. Data generation is verified locally.
# PINNING RULE (Trivy supply-chain compromise, Mar 2026): every third-party
# tool pinned by version + SHA/digest — no floating tags. SHAs below were
# verified against the upstream GitHub APIs on 2026-11-22.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run data:sanitize
      - run: npm run vault:test
      - run: npm run data:encrypt
      - run: npm run build:encrypted
      - run: npm run lint

  supply-chain:
    runs-on: ubuntu-latest
    continue-on-error: true # informational first — see TOOLS-VERDICTS.md
    steps:
      - uses: actions/checkout@v4
      - name: OSV-Scanner
        # google/osv-scanner-action v2.7.1, commit SHA verified 2026-11-22
        uses: google/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932
        with:
          scan-args: --recursive ./
      - name: Gitleaks (pinned binary, not the EULA-gated action)
        run: |
          set -euo pipefail
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks detect --no-git --verbose --redact
